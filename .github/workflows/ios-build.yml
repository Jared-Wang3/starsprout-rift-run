name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ios-cloud-build

permissions:
  contents: read

jobs:
  build-ios:
    name: Compile unsigned iPhone package
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor project
        run: npm run mobile:sync

      - name: Resolve Swift packages
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -resolvePackageDependencies

      - name: Build for iPhone
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build/ios
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/App.app build/ipa/Payload/
          cd build/ipa
          zip -qry starsprout-ios-unsigned.ipa Payload

      - name: Upload iPhone package
        uses: actions/upload-artifact@v4
        with:
          name: starsprout-ios-unsigned
          path: build/ipa/starsprout-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
